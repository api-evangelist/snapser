aid: snapser
name: Snapser
description: >-
  Snapser is a plug-and-play, modular backend-as-a-service platform for game
  studios and app developers. Instead of building infrastructure from scratch,
  teams assemble a backend from modular "Snaps" — managed microservices such as
  Authentication, Profiles, Storage, Leaderboards, Inventory, Chat, Social Graph,
  Matchmaking, Analytics, and an Event Bus — and deploy them together as a
  "Snapend" cluster fronted by its own API gateway. Developers can bring their
  own custom code (BYOSnap), game servers (BYOGS), and local workstations
  (BYOWS), then generate typed client SDKs and gRPC protobufs for a wide range of
  engines and languages including Unity, Unreal, Godot, Cocos, Roblox, iOS,
  Android, Flutter, C#, C++, Go, Python, TypeScript, Rust, and more. The snapctl
  CLI drives the entire build-and-deploy workflow. Snapser is backed by a16z.
