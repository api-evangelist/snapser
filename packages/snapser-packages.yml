notes: >-
  Snapser publishes exactly one first-party package to a public registry: the
  snapctl CLI on PyPI. Client SDKs are not published to npm/PyPI/NuGet/etc — they
  are generated per-Snapend and downloaded via `snapctl snapend download`
  (category=sdk) across a broad set of engines and languages. Those generated
  SDKs are first-party official Snapser output and are listed under
  `generated_sdks` below.
packages:
